
name: Scanner 7 Historical Backtest

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run historical backtest
        run: python backtest_independent_2R.py

      - name: Upload backtest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner7-backtest-results
          path: |
            *.xlsx
            *.csv
            *.json
            output/
          if-no-files-found: warn
          retention-days: 30
